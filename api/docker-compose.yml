services:
  postgres:
    image: postgres:16
    container_name: lcdpc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tuinvoice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - lcdpc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tuinvoice"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lcdpc-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      FRONTEND_URL: "http://localhost:4200"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: "123456"
      DB_NAME: tuinvoice
      DB_SSL: disable
      AUTH_PASSWORD_RESET_TTL_MINUTES: "${AUTH_PASSWORD_RESET_TTL_MINUTES:-30}"
      AUTH_REVOKE_SESSIONS_ON_PASSWORD_RESET: "${AUTH_REVOKE_SESSIONS_ON_PASSWORD_RESET:-true}"
      AUTH_GOOGLE_CLIENT_ID: "${AUTH_GOOGLE_CLIENT_ID:-}"
      AUTH_GOOGLE_CLIENT_SECRET: "${AUTH_GOOGLE_CLIENT_SECRET:-}"
      AUTH_GOOGLE_REDIRECT_URI: "${AUTH_GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/auth/register/google/callback}"
      AUTH_GOOGLE_SCOPE: "${AUTH_GOOGLE_SCOPE:-openid email profile}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:3000,http://localhost:5173}"
      OAUTH2_ISSUER: "${OAUTH2_ISSUER:-http://localhost:8080}"
      OAUTH2_AUDIENCE: "${OAUTH2_AUDIENCE:-lcdpc-api}"
      OAUTH2_ACCESS_TOKEN_TTL_MINUTES: "${OAUTH2_ACCESS_TOKEN_TTL_MINUTES:-60}"
      OAUTH2_REFRESH_TOKEN_TTL_DAYS: "${OAUTH2_REFRESH_TOKEN_TTL_DAYS:-30}"
      OAUTH2_AUTHORIZATION_CODE_TTL_MINUTES: "${OAUTH2_AUTHORIZATION_CODE_TTL_MINUTES:-10}"
      PASETO_KEY_PATH: "${PASETO_KEY_PATH:-}"
      RESEND_APITOKEN: "${RESEND_APITOKEN:-}"
      RESEND_FROM_ADDRESS: "${RESEND_FROM_ADDRESS:-LCDPC <onboarding@resend.dev>}"
    ports:
      - "8080:8080"
    volumes:
      - lcdpc_static_data:/static/img

volumes:
  lcdpc_postgres_data:
  lcdpc_static_data:
