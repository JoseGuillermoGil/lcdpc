services:
  postgres:
    image: postgres:16
    container_name: lcdpc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lcdpc_db
      POSTGRES_USER: lcdpc
      POSTGRES_PASSWORD: lcdpc123
    ports:
      - "5432:5432"
    volumes:
      - lcdpc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lcdpc -d lcdpc_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: LCDPC.API/Dockerfile
    container_name: lcdpc-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LCDPC: Host=postgres;Port=5432;Database=lcdpc_db;Username=lcdpc;Password=lcdpc123
      Auth__PasswordResetTtlMinutes: ${AUTH_PASSWORD_RESET_TTL_MINUTES:-30}
      Auth__RevokeSessionsOnPasswordReset: ${AUTH_REVOKE_SESSIONS_ON_PASSWORD_RESET:-true}
      Auth__SuperUserPassword: ${AUTH_SUPERUSER_PASSWORD:-SuperPerro123!}
      Auth__SuperUserAlias: ${AUTH_SUPERUSER_ALIAS:-admin_inicial}
      Auth__SuperUserEmail: ${AUTH_SUPERUSER_EMAIL:-admin@lcdpc.local}
      Auth__SuperUserFirstName: ${AUTH_SUPERUSER_FIRST_NAME:-Admin}
      Auth__SuperUserLastName: ${AUTH_SUPERUSER_LAST_NAME:-Inicial}
      Auth__SuperUserIdentityDocument: ${AUTH_SUPERUSER_IDENTITY_DOCUMENT:-V00000001}
      Auth__SuperUserWhatsAppPhone: ${AUTH_SUPERUSER_WHATSAPP_PHONE:-0000000000}
      Auth__SuperUserFullAddress: ${AUTH_SUPERUSER_FULL_ADDRESS:-Usuario administrador inicial}
      Auth__Google__ClientId: ${AUTH_GOOGLE_CLIENT_ID:-}
      Auth__Google__ClientSecret: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      Auth__Google__RedirectUri: ${AUTH_GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/auth/register/google/callback}
      Auth__Google__Scope: ${AUTH_GOOGLE_SCOPE:-openid email profile}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN_0:-http://localhost:4200}
      Cors__AllowedOrigins__1: ${CORS_ALLOWED_ORIGIN_1:-http://localhost:3000}
      Cors__AllowedOrigins__2: ${CORS_ALLOWED_ORIGIN_2:-http://localhost:5173}
      OAuth2__Issuer: ${OAUTH2_ISSUER:-http://localhost:8080}
      OAuth2__Audience: ${OAUTH2_AUDIENCE:-lcdpc-api}
      OAuth2__AccessTokenTtlMinutes: ${OAUTH2_ACCESS_TOKEN_TTL_MINUTES:-60}
      OAuth2__RefreshTokenTtlDays: ${OAUTH2_REFRESH_TOKEN_TTL_DAYS:-30}
      OAuth2__AuthorizationCodeTtlMinutes: ${OAUTH2_AUTHORIZATION_CODE_TTL_MINUTES:-10}
      OAuth2__RsaKeyPath: ${OAUTH2_RSA_KEY_PATH:-}
    ports:
      - "8080:8080"

volumes:
  lcdpc_postgres_data:
