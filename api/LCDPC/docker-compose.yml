services:
  postgres:
    image: postgres:16
    container_name: lcdpc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lcdpc_db
      POSTGRES_USER: lcdpc
      POSTGRES_PASSWORD: lcdpc123
    ports:
      - "5432:5432"
    volumes:
      - lcdpc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lcdpc -d lcdpc_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: LCDPC.API/Dockerfile
    container_name: lcdpc-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LCDPC: Host=postgres;Port=5432;Database=lcdpc_db;Username=lcdpc;Password=lcdpc123
      Auth__AccessTokenTtlMinutes: ${AUTH_ACCESS_TOKEN_TTL_MINUTES:-60}
      Auth__RefreshTokenTtlDays: ${AUTH_REFRESH_TOKEN_TTL_DAYS:-30}
      Auth__PasswordResetTtlMinutes: ${AUTH_PASSWORD_RESET_TTL_MINUTES:-30}
      Auth__RevokeSessionsOnPasswordReset: ${AUTH_REVOKE_SESSIONS_ON_PASSWORD_RESET:-true}
      Auth__SuperUserPassword: ${AUTH_SUPERUSER_PASSWORD:-SuperPerro123!}
      Auth__Google__ClientId: ${AUTH_GOOGLE_CLIENT_ID:-}
      Auth__Google__ClientSecret: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      Auth__Google__RedirectUri: ${AUTH_GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/auth/register/google/callback}
      Auth__Google__Scope: ${AUTH_GOOGLE_SCOPE:-openid email profile}
    ports:
      - "8080:8080"

volumes:
  lcdpc_postgres_data:
