<section class="classifications-page">
  <div class="page-header">
    <h1>Clasificaciones de Unidades</h1>
    @if (canCreate()) {
      <p-button label="Nueva Clasificacion" icon="pi pi-plus" (onClick)="openCreateDialog()"></p-button>
    }
  </div>

  <p-table [value]="classifications()" [loading]="loading()" styleClass="admin-table">
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th>Codigo</th>
        <th style="width: 120px">Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-classification>
      <tr>
        <td>{{ classification.name }}</td>
        <td><code>{{ classification.code }}</code></td>
        <td>
          @if (canUpdate()) {
            <p-button icon="pi pi-pencil" [text]="true" [rounded]="true"
                      (onClick)="openEditDialog(classification)" pTooltip="Editar"></p-button>
          }
          @if (canDelete()) {
            <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger"
                      (onClick)="confirmDelete(classification)" pTooltip="Eliminar"></p-button>
          }
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="empty-state">No hay clasificaciones registradas</td>
      </tr>
    </ng-template>
  </p-table>
</section>

<app-classification-form-dialog
  [visible]="dialogVisible()"
  [classification]="selectedClassification()"
  (visibleChange)="dialogVisible.set($event)"
  (saved)="onDialogClose(true)"
  (closed)="onDialogClose(false)"
></app-classification-form-dialog>

<p-confirmDialog />
<p-toast />
