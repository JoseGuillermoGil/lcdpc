<div class="admin-shell" [class.sidebar-collapsed]="collapsed()">
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      @if (!collapsed()) {
        <a routerLink="/admin/dashboard" class="sidebar-brand">LCDPC Admin</a>
      }
      <button class="sidebar-toggle" (click)="toggleSidebar()" [attr.aria-label]="collapsed() ? 'Expandir sidebar' : 'Colapsar sidebar'">
        <span class="pi" [ngClass]="collapsed() ? 'pi-chevron-right' : 'pi-chevron-left'"></span>
      </button>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/admin/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <span class="pi pi-chart-bar"></span>
        <span class="nav-label">Dashboard</span>
      </a>

      @if (canViewProducts()) {
        <a routerLink="/admin/products" routerLinkActive="active">
          <span class="pi pi-box"></span>
          <span class="nav-label">Productos</span>
        </a>
      }

      @if (canViewBundles()) {
        <a routerLink="/admin/bundles" routerLinkActive="active">
          <span class="pi pi-gift"></span>
          <span class="nav-label">Combos</span>
        </a>
      }

      @if (canViewOrders()) {
        <a routerLink="/admin/orders" routerLinkActive="active">
          <span class="pi pi-shopping-cart"></span>
          <span class="nav-label">Ordenes</span>
        </a>
      }

      @if (canViewStaff()) {
        <a routerLink="/admin/staff" routerLinkActive="active">
          <span class="pi pi-users"></span>
          <span class="nav-label">Personal</span>
        </a>
      }

      @if (canViewProducts()) {
        <a routerLink="/admin/classifications" routerLinkActive="active">
          <span class="pi pi-tags"></span>
          <span class="nav-label">Clasificaciones</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/" class="back-to-store">
        <span class="pi pi-arrow-left"></span>
        <span class="nav-label">Volver a la tienda</span>
      </a>
      <div class="sidebar-user">
        <span class="pi pi-user"></span>
        <span class="nav-label">{{ userName() }}</span>
      </div>
    </div>
  </aside>

  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>
</div>
