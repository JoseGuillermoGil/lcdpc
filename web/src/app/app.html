<app-header
  [branches]="branches"
  [selectedBranchId]="selectedBranchId()"
  [cartCount]="cartCount()"
  (branchChange)="selectBranch($event)"
  (cartClick)="incrementCart()"
></app-header>

<main class="landing-shell">

  <app-hero
    [heroSlides]="heroSlides"
    [activeHeroIndex]="activeHeroIndex()"
    [search]="search()"
    (previous)="previousSlide()"
    (next)="nextSlide()"
    (slideSelect)="activeHeroIndex.set($event)"
    (searchChange)="search.set($event)"
  ></app-hero>

  <app-catalog
    [categories]="categories"
    [selectedCategoryId]="selectedCategoryId()"
    [products]="filteredProducts()"
    (categorySelect)="selectCategory($event)"
    (increment)="incrementCart()"
    (decrement)="decrementCart()"
  ></app-catalog>

  <app-branches [branches]="branches"></app-branches>
</main>

<nav class="mobile-nav" aria-label="Acceso rápido móvil">
  <button class="mobile-nav-item active" type="button">
    <span class="pi pi-bars"></span>
    <span>Catálogo</span>
  </button>
  <button class="mobile-nav-item" type="button">
    <span class="pi pi-map-marker"></span>
    <span>Ubicación</span>
  </button>
  <button class="mobile-nav-item" type="button">
    <span class="pi pi-shopping-basket"></span>
    <span>Carrito</span>
    <span class="mobile-badge">{{ cartCount() }}</span>
  </button>
  <button class="mobile-nav-item" type="button">
    <span class="pi pi-user"></span>
    <span>Perfil</span>
  </button>
</nav>

<app-footer></app-footer>
