@if (showStoreShell()) {
  <app-header
    [branches]="branchStore.branches()"
    [selectedBranchId]="branchStore.selectedBranchId()"
    [cartCount]="cartStore.totalItems()"
    (branchChange)="selectBranch($event)"
    (cartClick)="openCartDialog()"
  ></app-header>

  <main class="landing-shell">
    <router-outlet></router-outlet>
  </main>

  <nav class="mobile-nav" aria-label="Acceso rápido móvil">
    <button class="mobile-nav-item active" type="button">
      <span class="pi pi-bars"></span>
      <span>Catálogo</span>
    </button>
    <button class="mobile-nav-item" type="button">
      <span class="pi pi-map-marker"></span>
      <span>Ubicación</span>
    </button>
    <button class="mobile-nav-item" type="button" (click)="openCartDialog()">
      <span class="pi pi-shopping-basket"></span>
      <span>Carrito</span>
      <span class="mobile-badge">{{ cartStore.totalItems() }}</span>
    </button>
    <button class="mobile-nav-item" type="button">
      <span class="pi pi-user"></span>
      <span>Perfil</span>
    </button>
  </nav>

  <app-cart-dialog [(visible)]="showCartDialog"></app-cart-dialog>

  <app-footer></app-footer>
} @else {
  <main class="auth-shell">
    <router-outlet></router-outlet>
  </main>
}
