<header class="topbar">
  <div class="topbar-inner">
    <a class="brand-lockup" routerLink="/" aria-label="Ir al inicio">
      @if (systemConfigStore.logoUrl()) {
        <img
          class="brand-logo"
          [src]="systemConfigStore.logoUrl()"
          [alt]="systemConfigStore.pageName()"
          (error)="onLogoError($event)"
        />
      } @else {
        <img
          class="brand-logo"
          src="/not-found.png"
          [alt]="systemConfigStore.pageName()"
        />
      }
      <span class="brand-name">{{ systemConfigStore.pageName() }}</span>
    </a>

    <div class="topbar-actions">
      @if (isAdmin()) {
        <p-button
          label="Administrar"
          icon="pi pi-cog"
          styleClass="admin-nav-button"
          [text]="true"
          severity="secondary"
          routerLink="/admin"
        ></p-button>
      }

      <p-button
        label="Buscar"
        icon="pi pi-search"
        styleClass="search-nav-button"
        [text]="true"
        severity="secondary"
        ariaLabel="Ir a búsqueda"
        routerLink="/search"
      ></p-button>

      <label class="branch-picker" aria-label="Seleccionar sucursal">
        <span class="pi pi-map-marker branch-icon"></span>
        <p-select
          styleClass="branch-select"
          [options]="branches"
          [ngModel]="selectedBranchId"
          (ngModelChange)="branchChange.emit($event)"
          optionLabel="name"
          optionValue="id"
          [showClear]="false"
          appendTo="body"
        ></p-select>
      </label>

      <div class="cart-wrap">
        <p-button
          icon="pi pi-shopping-cart"
          styleClass="cart-button"
          [rounded]="true"
          [text]="true"
          severity="secondary"
          ariaLabel="Carrito"
          (onClick)="cartClick.emit()"
        ></p-button>
        <span class="cart-count-badge">{{ cartCount }}</span>
      </div>

      @if (isAuthenticated()) {
        <div class="user-menu">
          <p-button
            [label]="user()?.displayName ?? ''"
            icon="pi pi-user"
            styleClass="account-button"
            [rounded]="true"
            [text]="true"
            severity="secondary"
            ariaLabel="Cuenta"
          ></p-button>
          <p-button
            icon="pi pi-sign-out"
            styleClass="logout-button"
            [rounded]="true"
            [text]="true"
            severity="secondary"
            ariaLabel="Cerrar sesión"
            (onClick)="logout()"
          ></p-button>
        </div>
      } @else {
        <p-button
          icon="pi pi-user"
          styleClass="account-button"
          [rounded]="true"
          [text]="true"
          severity="secondary"
          ariaLabel="Iniciar sesión"
          routerLink="/login"
        ></p-button>
      }
    </div>
  </div>
</header>
