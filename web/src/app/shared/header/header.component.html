      <p-button label="Salchichas" styleClass="nav-link" [text]="true" [rounded]="true" severity="secondary"></p-button>

    <div class="topbar-actions">
      <label class="branch-picker" aria-label="Seleccionar sucursal">
        <span class="pi pi-map-marker branch-icon"></span>
        <p-select
          styleClass="branch-select"
          [options]="branches"
          [ngModel]="selectedBranchId"
          (ngModelChange)="branchChange.emit($event)"
          optionLabel="name"
          optionValue="id"
          [showClear]="false"
          appendTo="body"
        ></p-select>
      </label>

      <div class="cart-wrap">
        <p-button
          icon="pi pi-shopping-cart"
          styleClass="cart-button"
          [rounded]="true"
          [text]="true"
          severity="secondary"
          ariaLabel="Carrito"
          (onClick)="cartClick.emit()"
        ></p-button>
        <span class="cart-count-badge">{{ cartCount }}</span>
      </div>

      <p-button
        icon="pi pi-user"
        styleClass="account-button"
        [rounded]="true"
        [text]="true"
        severity="secondary"
        ariaLabel="Cuenta"
      ></p-button>
    </div>
  </div>
</header>
