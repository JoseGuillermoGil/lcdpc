services:
  postgres:
    image: postgres:16
    container_name: lcdpc-postgres-go
    restart: unless-stopped
    environment:
      POSTGRES_DB: lcdpc_db
      POSTGRES_USER: lcdpc
      POSTGRES_PASSWORD: lcdpc123
    ports:
      - "5432:5432"
    volumes:
      - lcdpc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lcdpc -d lcdpc_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lcdpc-api-go
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://lcdpc:lcdpc123@postgres:5432/lcdpc_db?sslmode=disable"
      FRONTEND_URL: "http://localhost:4200"
      AUTH_PASSWORD_RESET_TTL_MINUTES: "${AUTH_PASSWORD_RESET_TTL_MINUTES:-30}"
      AUTH_REVOKE_SESSIONS_ON_PASSWORD_RESET: "${AUTH_REVOKE_SESSIONS_ON_PASSWORD_RESET:-true}"
      AUTH_SUPERUSER_PASSWORD: "${AUTH_SUPERUSER_PASSWORD:-SuperPerro123!}"
      AUTH_SUPERUSER_ALIAS: "${AUTH_SUPERUSER_ALIAS:-admin_inicial}"
      AUTH_SUPERUSER_EMAIL: "${AUTH_SUPERUSER_EMAIL:-admin@lcdpc.local}"
      AUTH_SUPERUSER_FIRST_NAME: "${AUTH_SUPERUSER_FIRST_NAME:-Admin}"
      AUTH_SUPERUSER_LAST_NAME: "${AUTH_SUPERUSER_LAST_NAME:-Inicial}"
      AUTH_SUPERUSER_IDENTITY_DOCUMENT: "${AUTH_SUPERUSER_IDENTITY_DOCUMENT:-V00000001}"
      AUTH_SUPERUSER_WHATSAPP_PHONE: "${AUTH_SUPERUSER_WHATSAPP_PHONE:-0000000000}"
      AUTH_SUPERUSER_FULL_ADDRESS: "${AUTH_SUPERUSER_FULL_ADDRESS:-Usuario administrador inicial}"
      AUTH_GOOGLE_CLIENT_ID: "${AUTH_GOOGLE_CLIENT_ID:-}"
      AUTH_GOOGLE_CLIENT_SECRET: "${AUTH_GOOGLE_CLIENT_SECRET:-}"
      AUTH_GOOGLE_REDIRECT_URI: "${AUTH_GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/auth/register/google/callback}"
      AUTH_GOOGLE_SCOPE: "${AUTH_GOOGLE_SCOPE:-openid email profile}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:3000,http://localhost:5173}"
      OAUTH2_ISSUER: "${OAUTH2_ISSUER:-http://localhost:8080}"
      OAUTH2_AUDIENCE: "${OAUTH2_AUDIENCE:-lcdpc-api}"
      OAUTH2_ACCESS_TOKEN_TTL_MINUTES: "${OAUTH2_ACCESS_TOKEN_TTL_MINUTES:-60}"
      OAUTH2_REFRESH_TOKEN_TTL_DAYS: "${OAUTH2_REFRESH_TOKEN_TTL_DAYS:-30}"
      OAUTH2_AUTHORIZATION_CODE_TTL_MINUTES: "${OAUTH2_AUTHORIZATION_CODE_TTL_MINUTES:-10}"
      PASETO_KEY_PATH: "${PASETO_KEY_PATH:-}"
      RESEND_APITOKEN: "${RESEND_APITOKEN:-}"
      RESEND_FROM_ADDRESS: "${RESEND_FROM_ADDRESS:-LCDPC <onboarding@resend.dev>}"
    ports:
      - "8080:8080"

volumes:
  lcdpc_postgres_data:
